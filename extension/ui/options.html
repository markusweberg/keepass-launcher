<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <form id="settings">
    <div class="field">
      <label for="db-path">Database file</label>
      <input id="db-path" type="text" spellcheck="false" required
             placeholder="C:\Users\you\Documents\Passwords.kdbx">
      <p class="hint">Full path to your .kdbx file. Variables like %USERPROFILE% work.</p>
    </div>

    <div class="field">
      <label for="group-name">Group to open</label>
      <input id="group-name" type="text" spellcheck="false" placeholder="Launch">
      <p class="hint">Every entry with a URL in this group (and its subgroups) opens as a tab.
        Use a path such as <code>Internet/Launch</code> for a nested group.</p>
    </div>

    <div class="row">
      <button type="submit" class="primary">Save</button>
      <button type="button" id="test">Test file access</button>
    </div>
    <p id="status" role="status" hidden></p>
  </form>

  <p id="private-warning" class="error" hidden>
    Private windows are not allowed yet. Turn on <b>Run in Private Windows</b> on this page.
  </p>

  <script src="options.js"></script>
</body>
</html>
